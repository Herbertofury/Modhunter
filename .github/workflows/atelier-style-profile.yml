name: Complete-library style diagnostics
on:
  workflow_dispatch:
  push:
    branches: ['diagnostics/atelier-style']
    paths: ['mo2_update_arsenal/web/app.js', 'mo2_update_arsenal/web/atelier.css', 'tests/frontend_runtime.test.cjs', 'tests/visual_gallery_paint_qa.py', 'tests/visual_surface_comparison.py', '.github/workflows/atelier-style-profile.yml']
permissions:
  contents: read
concurrency:
  group: modhunter-style-profile-${{ github.sha }}
  cancel-in-progress: true
jobs:
  flat-fill:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare the unchanged engine and verified font prerequisites
        run: |
          git fetch --no-tags origin 18883b32e0683dad8aed1dc87c6fe9ec577e12f2
          python3 -m venv /tmp/modhunter-surface
          /tmp/modhunter-surface/bin/pip install -q playwright==1.57.0 Pillow==13.0.0
          test -x /usr/local/share/chromium/chrome-linux/chrome
          /tmp/modhunter-surface/bin/python tests/prepare_ci_fonts.py --output native/target/surface-proof/ci-fonts.json
          node --test tests/frontend_runtime.test.cjs
          /tmp/modhunter-surface/bin/python tests/visual_surface_comparison.py --self-test
      - name: Verify actual hover, selected, focus, theme and forced-color states
        timeout-minutes: 5
        env:
          MODHUNTER_REQUIRE_BROWSER: '1'
        run: |
          PYTHONPATH=. /tmp/modhunter-surface/bin/python -m unittest discover -s tests -p test_gallery_workspace.py -v
          PYTHONPATH=. /tmp/modhunter-surface/bin/python tests/visual_gallery_paint_qa.py --control-ref 18883b32e0683dad8aed1dc87c6fe9ec577e12f2 --executable-path /usr/local/share/chromium/chrome-linux/chrome --output native/target/surface-proof/preflight
      - name: Preserve exact source, state geometry and actual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modhunter-Gallery-Fill-Proof
          path: native/target/surface-proof/
          if-no-files-found: error
          retention-days: 90
