<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modhunter · Rust</title><link rel="stylesheet" href="chrome.css"><link rel="stylesheet" href="native.css"></head>
<body>
<header class="top">
 <div class="brand"><span class="glyph" aria-hidden="true">ᛟ</span><span><b>MODHUNTER</b><small>RUST · NATIVE DESKTOP</small></span></div>
 <div class="tabstrip" id="tabs" role="tablist" aria-label="Mod and game tabs"></div>
 <div class="actions"><button id="newDash" title="Open another Mod Vault">＋ MODS</button><button id="newSiege" title="Open Modhunter Siege">⚔ SIEGE</button><button id="newRealm" title="Open Shiverfell">ᛟ REALM</button></div>
</header>
<nav class="bar" aria-label="Desktop commands">
 <div class="left"><button id="back" aria-label="Back">‹</button><button id="forward" aria-label="Forward">›</button><button id="reload" aria-label="Reload current tab">⟳</button></div>
 <div class="source"><span class="status" id="status"></span><span class="source-text" id="sourceText">Starting Rust engine…</span></div>
 <button id="importMo2" title="Read a real MO2 profile with the Rust engine">⌁ IMPORT MO2</button>
 <button id="refreshProfile" title="Reload local metadata; unchanged files use the Rust cache">REFRESH</button>
 <div class="connect"><input id="endpoint" aria-label="MO2 loopback address" placeholder="http://127.0.0.1:PORT/" spellcheck="false" autocomplete="off"><button id="connect">CONNECT</button><button id="disconnect">UNLINK</button></div>
 <button id="open" title="Open in system browser" aria-label="Open in system browser">↗</button><button id="copy" title="Copy active address" aria-label="Copy active address">⧉</button>
</nav>
<footer class="performance" aria-label="Rust engine status">
 <span class="engine">RUST ENGINE</span><span id="metrics">Ready · choose a profile or connect to MO2</span>
 <div class="paths"><button id="configureIni" title="Optional: select the instance configuration for separate MO2 data paths">INSTANCE INI</button><button id="configureMods" title="Optional: explicitly select the mods folder">MODS PATH</button><button id="clearPaths" title="Clear path overrides and use automatic detection">AUTO PATHS</button></div>
 <span id="message" role="status" aria-live="polite"></span>
</footer>
<script src="shell.js"></script></body></html>
