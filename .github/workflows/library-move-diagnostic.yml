name: Library connected-move diagnosis
on:
  push:
    branches: ['diagnostics/move-0.13.0']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: modhunter-library-move-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare the same Chromium runtime and fonts
        run: |
          python3 -m venv /tmp/modhunter-move
          /tmp/modhunter-move/bin/pip install -q playwright==1.57.0
          /tmp/modhunter-move/bin/python tests/prepare_ci_fonts.py --output /tmp/modhunter-move-proof/ci-fonts.json
          if ! command -v chromium >/dev/null && ! command -v chromium-browser >/dev/null; then
            /tmp/modhunter-move/bin/python -m playwright install --with-deps chromium
          fi
      - name: Compare complete library and actual state preservation
        env:
          MODHUNTER_REQUIRE_BROWSER: '1'
        run: |
          PYTHONPATH=. /tmp/modhunter-move/bin/python tests/library_move_diagnostic.py --output /tmp/modhunter-move-proof
      - name: Preserve complete and interrupted diagnostic measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modhunter-Library-Move-Diagnostic
          path: /tmp/modhunter-move-proof/
          if-no-files-found: error
          retention-days: 90
