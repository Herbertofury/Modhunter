name: Sync documentation to GitHub Wiki
on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: modhunter-live-wiki
  cancel-in-progress: false
jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish canonical wiki pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIKI_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/modhunter-wiki
          if ! git clone "$WIKI_URL" /tmp/modhunter-wiki; then
            echo "::error::The GitHub Wiki repository is not initialized or the Actions token lacks Wiki write access. Create the first Home page in GitHub's Wiki UI, or supply a credential with Wiki write permission."
            exit 1
          fi
          # Update repository-owned pages while preserving other Wiki content.
          cp wiki/*.md /tmp/modhunter-wiki/
          cd /tmp/modhunter-wiki
          git config user.name "Modhunter Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Wiki already current"; exit 0; fi
          git commit -m "docs: sync canonical Modhunter Wiki"
          git push origin HEAD
