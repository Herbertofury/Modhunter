name: Replay frozen public Skyrim downloads
on:
  push:
    branches: [upgrade/real-fomod-acceptance-20261124]
    paths: ['.github/workflows/qa-public-offer-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve the reviewed candidate installer
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45468052949
          name: Modhunter-Rust-Windows
          path: frozen
      - name: Verify and exercise the exact public manager bytes
        shell: pwsh
        run: |
          $Installer = (Get-ChildItem frozen -Recurse -Filter Modhunter_0.12.6_x64-setup.exe -File).FullName
          if ((Get-FileHash -LiteralPath $Installer).Hash -cne '9C6D92DDC3A3E660163F8383416A8F8351591160D48A4F1DE930F786945298FB') { throw 'Frozen installer identity changed.' }
          $ExeRoot = Join-Path $env:RUNNER_TEMP 'frozen-public-desktop'
          & 7z x $Installer "-o$ExeRoot" 'Modhunter.exe' -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Evidence = New-Item -ItemType Directory "$PWD/public-evidence"
          $Args = [Diagnostics.ProcessStartInfo]::new((Join-Path $ExeRoot 'Modhunter.exe'))
          $Args.UseShellExecute = $false
          $Args.ArgumentList.Add("--watchtower-smoke-output=$(Join-Path $Evidence 'managed.json')")
          $Args.ArgumentList.Add('--verify-public-skyrim-offers')
          $Proc = [Diagnostics.Process]::Start($Args)
          if (!$Proc.WaitForExit(120000)) { $Proc.Kill(); throw 'Public acquisition exceeded deadline.' }
          if (Test-Path public-evidence/managed.json) {
            $Proof = Get-Content -Raw public-evidence/managed.json | ConvertFrom-Json
            Write-Output "ok=$($Proof.ok) error=$($Proof.error)"
          }
          exit $Proc.ExitCode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-public-release-acquisition
          path: |
            public-evidence/*.json
            public-evidence/*.jsonl
          retention-days: 14
  local-service-download:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45469730451
          name: Modhunter-Rust-Windows
          path: frozen
      - name: Replay the frozen localhost authenticated downloads with receipt evidence
        shell: pwsh
        run: |
          $Installer = (Get-ChildItem frozen -Recurse -Filter Modhunter_0.12.6_x64-setup.exe -File).FullName
          if ((Get-FileHash -LiteralPath $Installer).Hash -cne '350CDDA7D02537AB956EFD1A6FF60507F60D484044CB67D64DD9D606D5683753') { throw 'Frozen identity mismatch' }
          $Dest = Join-Path $env:RUNNER_TEMP 'watchtower-frozen'
          & 7z x $Installer "-o$Dest" 'Modhunter.exe' -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($N in 1..4) {
            $Dir = New-Item -ItemType Directory "$PWD/owned-evidence/$N"
            $Info = [Diagnostics.ProcessStartInfo]::new((Join-Path $Dest 'Modhunter.exe'))
            $Info.UseShellExecute = $false
            $Info.CreateNoWindow = $true
            $Info.ArgumentList.Add("--watchtower-smoke-output=$(Join-Path $Dir 'smoke.json')")
            $Proc = [Diagnostics.Process]::Start($Info)
            $Journal = $null
            $Last = ''
            while (!$Proc.WaitForExit(40)) {
              if (!$Journal) { $Journal = Get-ChildItem "$Dir/watchtower-fixture-*/data/watchtower-acquisitions/receipts.json" -File -ErrorAction SilentlyContinue | Select-Object -First 1 }
              if ($Journal) {
                try {
                  $File = [IO.File]::Open($Journal.FullName, 'Open', 'Read', [IO.FileShare]'ReadWrite,Delete')
                  try { $Text = [IO.StreamReader]::new($File).ReadToEnd() } finally { $File.Dispose() }
                  $Summary = ConvertTo-Json -InputObject @(($Text | ConvertFrom-Json).jobs | Select-Object id,state,message,bytes,received,total) -Compress
                  if ($Summary -ne $Last) { Add-Content (Join-Path $Dir 'states.jsonl') -Value $Summary -Encoding utf8NoBOM; $Last = $Summary }
                } catch [IO.FileNotFoundException] { }
              }
            }
            $Result = Get-Content -Raw (Join-Path $Dir 'smoke.json') | ConvertFrom-Json
            Write-Output "trial=$N ok=$($Result.ok) error=$($Result.error)"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-authenticated-transfer-outcomes
          path: |
            owned-evidence/*/*.json
            owned-evidence/*/*.jsonl
          retention-days: 14
