name: Transparent preview browser diagnostic

on:
  workflow_dispatch:
  push:
    branches: ['diagnostics/atelier-style']
    paths: ['mo2_update_arsenal/web/atelier.css', 'tests/test_gallery_workspace.py', 'tests/visual_thumbnail_alpha_qa.py', '.github/workflows/atelier-style-profile.yml']

permissions:
  contents: read

concurrency:
  group: modhunter-thumbnail-alpha-${{ github.sha }}
  cancel-in-progress: true

jobs:
  transparent-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all fourteen Gallery cases and retain actual preview images
        env:
          MODHUNTER_REQUIRE_BROWSER: '1'
          MODHUNTER_QA_OUTPUT: /tmp/modhunter-alpha-proof
        run: |
          if ! git cat-file -e 7b2d734e5cac762c25a987f8b2d0bb24fae655e1^{commit}; then
            git fetch --no-tags --depth=1 origin 7b2d734e5cac762c25a987f8b2d0bb24fae655e1
          fi
          python3 -m venv /tmp/modhunter-alpha
          /tmp/modhunter-alpha/bin/pip install -q playwright==1.57.0 Pillow==13.0.0
          MODHUNTER_ALPHA_LAUNCHER=$(/tmp/modhunter-alpha/bin/python -c "import shutil; print(shutil.which('chromium') or shutil.which('chromium-browser') or '')")
          MODHUNTER_ALPHA_ENGINE=/usr/local/share/chromium/chrome-linux/chrome
          if [[ -z "$MODHUNTER_ALPHA_LAUNCHER" || ! -x "$MODHUNTER_ALPHA_ENGINE" ]]; then
            echo "::error::The preinstalled Chromium engine is unavailable."
            exit 1
          fi
          /tmp/modhunter-alpha/bin/python tests/prepare_ci_fonts.py --output /tmp/modhunter-alpha-proof/ci-fonts.json
          PYTHONPATH=. /tmp/modhunter-alpha/bin/python tests/visual_thumbnail_alpha_qa.py --launcher-path "$MODHUNTER_ALPHA_LAUNCHER" --executable-path "$MODHUNTER_ALPHA_ENGINE" --output /tmp/modhunter-alpha-proof
      - name: Preserve actual Gallery results, browser identity and six preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modhunter-Transparent-Preview-Diagnostic
          path: /tmp/modhunter-alpha-proof/
          if-no-files-found: error
          retention-days: 30
