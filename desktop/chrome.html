<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modhunter Tab Bar</title><link rel="stylesheet" href="chrome.css"></head><body><header class="top"><div class="brand"><span class="glyph">ᛟ</span><span><b>MODHUNTER</b><small>THE UNFINISHED WORLD</small></span></div><div class="tabstrip" id="tabs" aria-label="Game and modding tabs"></div><div class="actions"><button id="newDash" title="New Mod Vault tab">＋ MODS</button><button id="newSiege" title="New survivor arena tab">⚔ SIEGE</button><button id="newRealm" title="New open world tab">ᛟ REALM</button></div></header><nav class="bar" aria-label="Tab commands"><div class="left"><button id="back" aria-label="Back" title="Back">‹</button><button id="forward" aria-label="Forward" title="Forward">›</button><button id="reload" aria-label="Reload" title="Reload">⟳</button></div><div class="source"><span class="status" id="status"></span><span class="source-text" id="sourceText">Offline practice · 3 independent components</span></div><button id="importMo2" title="Import your real MO2 profile modlist.txt without installing the MO2 plugin">⌁ IMPORT MO2</button><div class="connect"><input id="endpoint" aria-label="MO2 loopback address" placeholder="Optional MO2 link: http://127.0.0.1:PORT/" spellcheck="false"><button id="connect" title="Connect to a running MO2 Arsenal plugin">CONNECT</button><button id="disconnect" title="Return to offline mode">UNLINK</button></div><button id="open" title="Open active URL in system browser">↗</button><button id="copy" title="Copy active URL">⧉</button></nav><div class="toast" id="toast" role="status" aria-live="polite"></div><script src="chrome.js"></script></body></html>
