name: Gallery attribution on frozen Windows bytes
on:
  push:
    branches: ['diagnostics/gallery-trace-89b8']
    paths: ['.github/workflows/gallery-trace-89b8.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: modhunter-gallery-trace-89b8
  cancel-in-progress: false

jobs:
  gallery-diagnostic:
    if: github.repository == 'Herbertofury/Modhunter' && github.event_name == 'push' && github.ref == 'refs/heads/diagnostics/gallery-trace-89b8'
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          fetch-depth: 2
          path: carrier
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: 89b8ef3f62fc097e94f5da9c2647c5ff6dac27c8
          path: exact
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify source and materialize only the pinned prior executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: python carrier/.github/diagnostics/gallery-trace-89b8/carrier.py stage
      - name: Install the exact existing no-browser-download Playwright client
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm install --prefix "$env:RUNNER_TEMP/modhunter-gallery-deps" --ignore-scripts --no-audit --no-fund playwright@1.57.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bounded A/A then A/B, with the original native owned launcher boundaries
        run: |
          $env:NODE_PATH = "$env:RUNNER_TEMP/modhunter-gallery-deps/node_modules"
          python carrier/.github/diagnostics/gallery-trace-89b8/carrier.py measure
          exit $LASTEXITCODE
      - name: Retain only the bounded diagnostic aggregates
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Modhunter-Gallery-Attribution-Diagnostic-Only
          path: ${{ runner.temp }}/modhunter-gallery-frozen/report.json
          retention-days: 3
          if-no-files-found: ignore
