name: Complete-library style diagnostics
on:
  workflow_dispatch:
  push:
    branches: ['diagnostics/atelier-style']
    paths: ['mo2_update_arsenal/web/app.js', 'tests/visual_width_comparison.py', 'tests/frontend_runtime.test.cjs', '.github/workflows/atelier-style-profile.yml']
permissions:
  contents: read
concurrency:
  group: modhunter-style-profile-${{ github.sha }}
  cancel-in-progress: true
jobs:
  width-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare exact C7 and candidate source with the complete library
        env:
          MODHUNTER_REQUIRE_BROWSER: '1'
        run: |
          git fetch --no-tags origin 18883b32e0683dad8aed1dc87c6fe9ec577e12f2
          python3 -m venv /tmp/modhunter-width
          /tmp/modhunter-width/bin/pip install -q playwright==1.57.0
          test -x /usr/local/share/chromium/chrome-linux/chrome
          /tmp/modhunter-width/bin/python tests/prepare_ci_fonts.py --output native/target/width-comparison/ci-fonts.json
          node --test tests/frontend_runtime.test.cjs
          /tmp/modhunter-width/bin/python tests/visual_width_comparison.py --self-test
      - name: Measure four fresh complete-library contexts
        timeout-minutes: 12
        run: |
          PYTHONPATH=. /tmp/modhunter-width/bin/python tests/visual_width_comparison.py --output native/target/width-comparison --control-ref 18883b32e0683dad8aed1dc87c6fe9ec577e12f2 --executable-path /usr/local/share/chromium/chrome-linux/chrome
      - name: Preserve every timing, complete geometry and source identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modhunter-Width-Comparison
          path: native/target/width-comparison/
          if-no-files-found: error
          retention-days: 90
