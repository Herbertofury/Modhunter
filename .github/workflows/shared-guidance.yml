name: Shared guidance acceptance
on:
  push:
    paths: ['AGENTS.md', '.agents/**', '.athena/**', '.agent-foundry/**', 'CLAUDE.md', '.github/workflows/shared-guidance.yml']
  pull_request:
    paths: ['AGENTS.md', '.agents/**', '.athena/**', '.agent-foundry/**', 'CLAUDE.md', '.github/workflows/shared-guidance.yml']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout exact reviewed historical adoption
        uses: actions/checkout@v4
        with:
          ref: 662f2507ad1816efc0da1d8ac3acb66c8e55797f
          path: .guidance-original
          persist-credentials: false
      - name: Replay all original preservation and exact routing assertions
        working-directory: .guidance-original
        run: python -B -m unittest discover -s .agents/acceptance -v
      - name: Verify current router, pins and owner-approved links
        run: python -B .agents/acceptance/check_live_router.py .guidance-original/AGENTS.md
