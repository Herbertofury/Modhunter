name: Apply reviewed compact workspace and startup checks
on:
  push:
    branches: [upgrade/live-repair-0102]
    paths: ['.delivery/**', '.github/workflows/apply-compact.yml']
permissions:
  contents: write
concurrency:
  group: apply-compact-0102
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'Herbertofury/Modhunter' && github.ref == 'refs/heads/upgrade/live-repair-0102'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact base and reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 9815bad7e3347d5ee290a80c992d45026152227e HEAD -- . ':!.delivery' ':!.github/workflows/apply-compact.yml'
          python3 - <<'PY'
          import hashlib, lzma, pathlib, subprocess, tempfile
          packed = b''.join(pathlib.Path(f'.delivery/compact-{i}.bin').read_bytes() for i in range(1, 6))
          assert len(packed) == 25792
          assert hashlib.sha256(packed).hexdigest() == '4c54134057482f491dcb8c6b2043f81501b62811fa7f6c90a6f1efdf51e6db56'
          decoder = lzma.LZMADecompressor()
          patch = decoder.decompress(packed, max_length=150001)
          assert decoder.eof and not decoder.unused_data
          assert len(patch) == 112770
          assert hashlib.sha256(patch).hexdigest() == '4e2b7146dcbe1b9268017dc7b3cd597d175b6dec60e8e97fb3393ffc636dae90'
          with tempfile.NamedTemporaryFile() as f:
              f.write(patch); f.flush()
              subprocess.run(['git', 'apply', '--check', '--unidiff-zero', f.name], check=True)
              subprocess.run(['git', 'apply', '--unidiff-zero', f.name], check=True)
          pathlib.Path('.delivery/native-rust.yml').write_bytes(pathlib.Path('.github/workflows/native-rust.yml').read_bytes())
          PY
          # The connector applies workflow changes with its authorized scope.
          git restore --source=HEAD --staged --worktree -- .github/workflows
          git rm -- .delivery/compact-1.bin .delivery/compact-2.bin .delivery/compact-3.bin .delivery/compact-4.bin .delivery/compact-5.bin
          cargo fmt --manifest-path native/Cargo.toml --all
          python3 native/scripts/prepare_assets.py
          git diff --check
      - name: Verify launch checking, status and backup regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 native/scripts/prepare_release.py --print-version)" = '0.10.2'
          python3 -m unittest discover -s tests -p 'test_startup_checks.py' -v
          python3 -m unittest discover -s tests -p 'test_scan_lifecycle.py' -v
          python3 -m unittest discover -s tests -p 'test_scanner_bounded_work.py' -v
          python3 -m unittest discover -s tests -p 'test_profile_backup_durability.py' -v
          python3 native/scripts/prepare_release.py --self-test
          node --check native/scripts/verify_live_desktop.cjs
          node --test tests/frontend_runtime.test.cjs
          node --test native/crates/modhunter-desktop/tests/shell_runtime.test.cjs
      - name: Preserve the reviewed source on the repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Replace oversized dashboard with compact workspace and automatic launch checking' -m 'Show detected update and maintenance evidence independently from manual notes. Hydrate preferences before one bounded shared startup check, publish partial results, preserve exact provider identity, honor cancellation and pause after repeated service failures. Retain profile backup guards from main. Keep full native acceptance mandatory; the companion workflow is applied separately by the authorized connector.'
          git push origin HEAD:refs/heads/upgrade/live-repair-0102
          mkdir -p "$RUNNER_TEMP/compact-checkpoint"
          git rev-parse HEAD > "$RUNNER_TEMP/compact-checkpoint/COMMIT.txt"
          git bundle create "$RUNNER_TEMP/compact-checkpoint/Modhunter-source.bundle" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Modhunter-Compact-Source
          path: ${{ runner.temp }}/compact-checkpoint/
          if-no-files-found: error
          retention-days: 30
