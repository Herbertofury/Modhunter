name: Apply reviewed MO2 and GameSync upgrade
on:
  push:
    branches: [upgrade/mo253-gamesync-0101]
    paths: ['.delivery/**', '.github/workflows/apply-mo253-upgrade.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: apply-mo253-gamesync-0101
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'Herbertofury/Modhunter' && github.ref == 'refs/heads/upgrade/mo253-gamesync-0101'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt
      - name: Verify exact base and reviewed patch bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '7bbf078b1d4e38839993d3bc29cacfc16a284a99'
          python3 - <<'PY'
          import gzip, hashlib, io, pathlib, subprocess, tempfile
          parts = [pathlib.Path(f'.delivery/mo253-{i}.bin') for i in range(1, 5)]
          packed = b''.join(p.read_bytes() for p in parts)
          assert len(packed) == 29712
          assert hashlib.sha256(packed).hexdigest() == '889cc69550be86edde6908e61a249ecde47a403a8ea542836e628302ab88d9a2'
          with gzip.GzipFile(fileobj=io.BytesIO(packed)) as stream:
              patch = stream.read(1_000_001)
          assert len(patch) == 96241
          assert hashlib.sha256(patch).hexdigest() == '73d83b9fecf9852485ab0519bf8ad0b6c6802ed01c9da10cb7e054a316bb7099'
          with tempfile.NamedTemporaryFile() as f:
              f.write(patch); f.flush()
              subprocess.run(['git', 'apply', '--check', f.name], check=True)
              subprocess.run(['git', 'apply', f.name], check=True)
          PY
          git rm -- .delivery/mo253-1.bin .delivery/mo253-2.bin .delivery/mo253-3.bin .delivery/mo253-4.bin .github/workflows/apply-mo253-upgrade.yml
          cargo fmt --manifest-path native/Cargo.toml --all
          git diff --check
      - name: Check version and focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 native/scripts/prepare_release.py --print-version)" = '0.10.1'
          python3 -m unittest discover -s tests -p 'test_update_version_evidence.py' -v
          python3 -m unittest discover -s tests -p 'test_qt_runtime_policy.py' -v
          python3 native/scripts/prepare_release.py --self-test
      - name: Commit source only on the dedicated upgrade branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Prepare MO2 2.5.3 testing and transfer guarded GameSync update techniques' -m 'Version 0.10.1: qualify the original Qt helper on Qt 6.11.1, add read-only MO2 readiness checks, bounded version evidence, persistent HTTP 503 cooldowns and required release receipts. Exact beta-12 execution is not claimed.'
          git push origin HEAD:refs/heads/upgrade/mo253-gamesync-0101
          mkdir -p "$RUNNER_TEMP/delivered-source"
          git bundle create "$RUNNER_TEMP/delivered-source/Modhunter-source.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/delivered-source/Modhunter-source.bundle"
          git rev-parse HEAD > "$RUNNER_TEMP/delivered-source/COMMIT.txt"
          cd "$RUNNER_TEMP/delivered-source"
          sha256sum Modhunter-source.bundle COMMIT.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Modhunter-Delivered-Source
          path: ${{ runner.temp }}/delivered-source/
          retention-days: 30
          if-no-files-found: error
      - name: Run the full required readiness workflow on the committed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run native-rust.yml --repo Herbertofury/Modhunter --ref upgrade/mo253-gamesync-0101
