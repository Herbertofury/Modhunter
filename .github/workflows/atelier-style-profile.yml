name: Complete-library style diagnostics
on:
  workflow_dispatch:
  push:
    branches: ['diagnostics/atelier-style']
    paths: ['mo2_update_arsenal/web/app.js', 'tests/frontend_runtime.test.cjs', 'tests/test_gallery_workspace.py', 'tests/visual_surface_comparison.py', '.github/workflows/atelier-style-profile.yml']
permissions:
  contents: read
concurrency:
  group: modhunter-style-profile-${{ github.sha }}
  cancel-in-progress: true
jobs:
  cold-row-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare unchanged engine, pinned fonts and runtime contracts
        run: |
          set -o pipefail
          git fetch --no-tags origin 18883b32e0683dad8aed1dc87c6fe9ec577e12f2
          python3 -m venv /tmp/modhunter-surface
          /tmp/modhunter-surface/bin/pip install -q playwright==1.57.0 Pillow==13.0.0
          test -x /usr/local/share/chromium/chrome-linux/chrome
          /tmp/modhunter-surface/bin/python tests/prepare_ci_fonts.py --output native/target/surface-proof/ci-fonts.json
          node --test tests/frontend_runtime.test.cjs | tee native/target/surface-proof/frontend-runtime.tap
          /tmp/modhunter-surface/bin/python tests/visual_surface_comparison.py --self-test
      - name: Verify all nineteen actual Gallery and cache lifecycle cases
        timeout-minutes: 3
        env:
          MODHUNTER_REQUIRE_BROWSER: '1'
        run: |
          PYTHONPATH=tests /tmp/modhunter-surface/bin/python - <<'PYCODE'
          import hashlib, json, os, subprocess, sys, time, unittest
          from pathlib import Path
          import test_gallery_workspace as gallery
          output=Path('native/target/surface-proof/gallery'); output.mkdir(parents=True,exist_ok=True)
          paths=['mo2_update_arsenal/web/app.js','tests/frontend_runtime.test.cjs','tests/test_gallery_workspace.py']
          git=lambda *args: subprocess.check_output(['git',*args],text=True).strip()
          report={'sourceCommit':git('rev-parse','HEAD'),'sourceStatusAtStart':git('status','--porcelain'),
              'sources':{p:{'bytes':Path(p).stat().st_size,'sha256':hashlib.sha256(Path(p).read_bytes()).hexdigest()} for p in paths},
              'browserVersions':[], 'started':[], 'passed':[], 'expectedCases':19}
          assert report['sourceCommit']==os.environ['GITHUB_SHA'] and report['sourceStatusAtStart']==''
          class Result(unittest.TextTestResult):
              def startTest(self,test):
                  report['started'].append(test.id())
                  version=test.browser.version
                  if version not in report['browserVersions']: report['browserVersions'].append(version)
                  super().startTest(test)
              def addSuccess(self,test):
                  report['passed'].append(test.id()); super().addSuccess(test)
          suite=unittest.defaultTestLoader.loadTestsFromTestCase(gallery.GalleryWorkspaceTests)
          assert suite.countTestCases()==19
          started=time.monotonic()
          with (output/'unittest.log').open('w') as log:
              result=unittest.TextTestRunner(stream=log,verbosity=2,resultclass=Result).run(suite)
          report.update(testsRun=result.testsRun,elapsedSeconds=time.monotonic()-started,
              failures=[str(t) for t,_ in result.failures],errors=[str(t) for t,_ in result.errors],
              skipped=[str(t) for t,_ in result.skipped],expectedFailures=[str(t) for t,_ in result.expectedFailures],
              unexpectedSuccesses=[str(t) for t in result.unexpectedSuccesses],
              sourceStatusAtEnd=git('status','--porcelain'),sourceCommitAtEnd=git('rev-parse','HEAD'))
          report['ok']=result.wasSuccessful() and result.testsRun==19 and len(report['passed'])==19 and not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses and report['sourceStatusAtEnd']=='' and report['sourceCommitAtEnd']==report['sourceCommit']
          (output/'browser-cases.json').write_text(json.dumps(report,indent=2)+'\n')
          print((output/'unittest.log').read_text()); print(json.dumps(report,indent=2))
          sys.exit(0 if report['ok'] else 1)
          PYCODE
      - name: Measure all 11207 records in four fresh contexts
        timeout-minutes: 12
        run: |
          PYTHONPATH=. /tmp/modhunter-surface/bin/python tests/visual_surface_comparison.py --mode cold-row-cache --output native/target/surface-proof/comparison --control-ref 18883b32e0683dad8aed1dc87c6fe9ec577e12f2 --executable-path /usr/local/share/chromium/chrome-linux/chrome
      - name: Preserve complete interaction, geometry, pixel and timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modhunter-Cold-Row-Cache-Proof
          path: native/target/surface-proof/
          if-no-files-found: error
          retention-days: 90
