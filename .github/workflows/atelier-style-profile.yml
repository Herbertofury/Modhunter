name: Complete-library style diagnostics
on:
  workflow_dispatch:
  push:
    branches: ['diagnostics/atelier-style']
    paths: ['tests/visual_raster_repeatability.py', 'tests/visual_surface_comparison.py', '.github/workflows/atelier-style-profile.yml']
permissions:
  contents: read
concurrency:
  group: modhunter-style-profile-${{ github.sha }}
  cancel-in-progress: true
jobs:
  raster-repeatability:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare the same engine and pinned fonts for unchanged C7
        run: |
          git fetch --no-tags origin 18883b32e0683dad8aed1dc87c6fe9ec577e12f2
          python3 -m venv /tmp/modhunter-raster
          /tmp/modhunter-raster/bin/pip install -q playwright==1.57.0 Pillow==13.0.0
          test -x /usr/local/share/chromium/chrome-linux/chrome
          /tmp/modhunter-raster/bin/python tests/prepare_ci_fonts.py --output native/target/raster-proof/ci-fonts.json
          /tmp/modhunter-raster/bin/python tests/visual_raster_repeatability.py --self-test
      - name: Record six unmodified same-source viewport captures
        timeout-minutes: 4
        run: |
          PYTHONPATH=. /tmp/modhunter-raster/bin/python tests/visual_raster_repeatability.py --control-ref 18883b32e0683dad8aed1dc87c6fe9ec577e12f2 --executable-path /usr/local/share/chromium/chrome-linux/chrome --font-receipt native/target/raster-proof/ci-fonts.json --output native/target/raster-proof/comparison
      - name: Preserve actual pixels and complete source-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modhunter-Raster-Repeatability-Proof
          path: native/target/raster-proof/
          if-no-files-found: error
          retention-days: 90
