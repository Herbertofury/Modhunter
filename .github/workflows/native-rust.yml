name: Rust desktop and MO2 readiness
on:
  push:
    branches: [main, 'upgrade/**']
    paths: ['native/**', 'mo2_update_arsenal/**', 'desktop/**', 'tests/**', 'scripts/**', 'build.py', '.github/workflows/native-rust.yml']
  pull_request:
    paths: ['native/**', 'mo2_update_arsenal/**', 'desktop/**', 'tests/**', 'scripts/**', 'build.py', '.github/workflows/native-rust.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: modhunter-rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-on-failure: 'true'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Rust, MO2 lifecycle, and existing features
        run: |
          python3 native/scripts/prepare_release.py --print-version
          python3 native/scripts/prepare_assets.py
          python3 native/scripts/prepare_archive_tools.py
          python3 native/scripts/prepare_notices.py
          cargo fmt --manifest-path native/Cargo.toml --all -- --check
          cargo test --manifest-path native/Cargo.toml --workspace --locked
          cargo build --manifest-path native/Cargo.toml --locked -p modhunter-core --bin modhunter-cli
          MODHUNTER_CONTENT_CLI="$PWD/native/target/debug/modhunter-cli" python3 -m unittest discover -s tests -p test_content_recovery.py -v
          python3 native/scripts/verify_archive_review.py --cli native/target/debug/modhunter-cli --output native/target/archive-review-proof.json
          python3 native/scripts/verify_plugin_bridge.py --cli native/target/debug/modhunter-cli --output native/target/plugin-bridge-protocol.json
          python3 native/scripts/verify_source_bridge.py --cli native/target/debug/modhunter-cli --output native/target/source-bridge-protocol.json
          cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets --locked -- -D warnings
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          node --check native/ui/shell.js
          node --check native/ui/watchtower.js
          node --check native/ui/watchtower-review.js
          node --check native/ui/watchtower-maintenance.js
          node --check native/ui/preferences.js
          node --test tests/watchtower_source_scripts.test.cjs
          node --check tests/fixtures/watchtower_native_fixture.js
          node --test native/crates/modhunter-desktop/tests/shell_runtime.test.cjs
          node --test tests/mod_insights.test.cjs
          node --test tests/source_insights.test.cjs
          node --test tests/frontend_runtime.test.cjs
          node --test desktop/offline_mo2.test.cjs
          python3 native/scripts/prepare_release.py --self-test
          python3 native/scripts/mo2_smoke_plugin/modhunter_native_smoke/audit_probe.py --self-test
      - name: Exercise actual dashboard in Chromium
        env:
          MODHUNTER_REQUIRE_BROWSER: '1'
        run: |
          python3 -m venv /tmp/modhunter-qa
          /tmp/modhunter-qa/bin/pip install -q playwright==1.57.0
          /tmp/modhunter-qa/bin/python -m playwright install --with-deps chromium
          PYTHONPATH=. MODHUNTER_QA_OUTPUT=/tmp/modhunter-proof /tmp/modhunter-qa/bin/python tests/updater_sss_browser_qa.py
          PYTHONPATH=. /tmp/modhunter-qa/bin/python -m unittest discover -s tests -p 'test_frontend_responsiveness.py' -v
          PYTHONPATH=. MODHUNTER_QA_OUTPUT=/tmp/modhunter-proof /tmp/modhunter-qa/bin/python -m unittest discover -s tests -p 'test_compact_workspace.py' -v
          PYTHONPATH=. MODHUNTER_QA_OUTPUT=/tmp/modhunter-proof /tmp/modhunter-qa/bin/python tests/test_watchtower_browser.py
          PYTHONPATH=. MODHUNTER_QA_OUTPUT=/tmp/modhunter-proof /tmp/modhunter-qa/bin/python -m unittest discover -s tests -p test_watchtower_sources_ui.py -v
          PYTHONPATH=. MODHUNTER_QA_OUTPUT=/tmp/modhunter-proof /tmp/modhunter-qa/bin/python tests/test_watchtower_native_ui.py
          PYTHONPATH=. /tmp/modhunter-qa/bin/python scripts/benchmark_dashboard_render.py --baseline-ref 63e5df3e3ef218ae72ce58b5e4502165c40ca604 --output /tmp/modhunter-proof/dashboard-render-comparison.json
      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modhunter-Rust-Browser-Proof
          path: /tmp/modhunter-proof/
          if-no-files-found: warn
  windows:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-on-failure: 'true'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare all existing dashboard and game assets
        run: |
          python native/scripts/prepare_release.py --print-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python native/scripts/prepare_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python native/scripts/prepare_archive_tools.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python native/scripts/prepare_notices.py
      - name: Install the Qt SDK matching MO2 2.5.2
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.1'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          archives: qtbase
          cache: 'true'
          set-env: 'false'
      - name: Build and test the narrow native Qt bridge
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.qt.outputs.qt-root-dir }}/bin;$env:PATH"
          cmake -S native/qt_bridge -B native/target/qt-bridge -A x64 "-DCMAKE_PREFIX_PATH=${{ steps.qt.outputs.qt-root-dir }}" -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build native/target/qt-bridge --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir native/target/qt-bridge -C Release --output-on-failure
      - name: Install Qt 6.11.1 for the forward-runtime acceptance check
        id: qt_forward
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          # Qt 6.11 changed its repository layout; pin the merged upstream fix.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: qtbase
          cache: 'true'
          set-env: 'false'
      - name: Verify the packaged baseline helper on actual Qt 6.11.1
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.qt_forward.outputs.qt-root-dir }}/bin;$env:PATH"
          cmake -S native/qt_bridge -B native/target/qt-forward -A x64 "-DCMAKE_PREFIX_PATH=${{ steps.qt_forward.outputs.qt-root-dir }}" -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build native/target/qt-forward --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item native/target/qt-bridge/Release/modhunter-qt-bridge.dll native/target/qt-forward/Release/modhunter-qt-bridge.dll -Force
          ctest --test-dir native/target/qt-forward -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Python environments are not relocatable build outputs. Never reuse
          # one restored with the Cargo target cache or from a cancelled run.
          $QtTestVenv = Join-Path $env:RUNNER_TEMP ('modhunter-qt-forward-' + [guid]::NewGuid().ToString('N'))
          $QtTestPython = Join-Path $QtTestVenv 'Scripts/python.exe'
          python -m venv $QtTestVenv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $QtTestPython -m pip install --disable-pip-version-check PyQt6==6.11.0 PyQt6-Qt6==6.11.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $QtTestPython native/scripts/verify_qt_forward.py --bridge-dir native/target/qt-forward/Release --output native/target/qt-forward/qt-forward.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify non-destructive Windows PowerShell readiness checks
        shell: pwsh
        run: ./native/scripts/test_mo2_readiness.ps1
      - name: Verify plugin installation and progress-preserving upgrades
        shell: pwsh
        run: ./native/scripts/test_plugin_installer.ps1
      - name: Test native Windows code
        run: |
          cargo test --manifest-path native/Cargo.toml --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python native/scripts/verify_archive_review.py --cli native/target/debug/modhunter-cli.exe --output native/target/archive-review-proof.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Build Rust executable and Windows installer
        working-directory: native/crates/modhunter-desktop
        run: npx --yes @tauri-apps/cli@2 build
      - name: Build portable Rust diagnostic CLI
        run: cargo build --manifest-path native/Cargo.toml --release --locked -p modhunter-core
      - name: Verify the exact release CLI and packaged archive helper
        run: python native/scripts/verify_archive_review.py --cli native/target/release/modhunter-cli.exe --output native/target/archive-review-proof.json
      - name: Launch actual Windows WebView2 and import a fixture profile
        shell: pwsh
        run: ./native/scripts/windows_smoke.ps1 -Executable "$PWD/native/target/release/Modhunter.exe" -Output "$PWD/native/target/native-smoke"
      - name: Verify Watchtower sessions and page observations in actual WebView2
        shell: pwsh
        run: ./native/scripts/watchtower_smoke.ps1 -Executable "$PWD/native/target/release/Modhunter.exe" -Output "$PWD/native/target/watchtower-smoke"
      - name: Exercise the compiled desktop connected to actual MO2
        shell: pwsh
        run: |
          $LiveTools = Join-Path $env:RUNNER_TEMP 'modhunter-live-tools'
          npm install --prefix $LiveTools --no-audit --no-fund playwright@1.57.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NODE_PATH = Join-Path $LiveTools 'node_modules'
          ./native/scripts/mo2_native_smoke.ps1 -RustCliPath "$PWD/native/target/release/modhunter-cli.exe" -QtBridgePath "$PWD/native/target/qt-bridge/Release/modhunter-qt-bridge.dll" -DesktopExecutable "$PWD/native/target/release/Modhunter.exe" -EvidenceDirectory "$PWD/native/target/live-mo2-smoke" -TimeoutSeconds 240
      - name: Package tested Windows app, MO2 plugin, and diagnostics
        shell: pwsh
        run: |
          $ReleaseVersion = python native/scripts/prepare_release.py --print-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ReleaseVersion = $ReleaseVersion.Trim()
          if (Test-Path native/target/portable) { Remove-Item -Recurse -Force native/target/portable }
          New-Item -ItemType Directory -Force native/target/portable/MO2 | Out-Null
          Copy-Item native/target/release/Modhunter.exe native/target/portable/
          Copy-Item -Recurse native/resources/archive-tools native/target/portable/archive-tools
          Copy-Item -Recurse mo2_update_arsenal native/target/portable/MO2/
          Get-ChildItem -Recurse native/target/portable -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Copy-Item native/README.md native/target/portable/README.md
          Copy-Item native/PROJECT_NOTICE.txt native/target/portable/PROJECT_NOTICE.txt
          Copy-Item native/resources/THIRD_PARTY_NOTICES.json native/target/portable/THIRD_PARTY_NOTICES.json
          Copy-Item native/Install_MO2_Plugin.ps1 native/target/portable/
          Copy-Item native/Install_MO2_Plugin.bat native/target/portable/
          Copy-Item native/Check_MO2_Readiness.ps1 native/target/portable/
          Copy-Item native/Check_MO2_Readiness.bat native/target/portable/
          Copy-Item wiki/MO2-253-Testing.md native/target/portable/START-HERE-MO2-253.md
          Copy-Item wiki/GameSync-Update-Techniques.md native/target/portable/GameSync-Update-Techniques.md
          Copy-Item native/target/release/modhunter-cli.exe native/target/portable/
          New-Item -ItemType Directory -Force native/target/portable/MO2/mo2_update_arsenal/bin | Out-Null
          Copy-Item native/target/release/modhunter-cli.exe native/target/portable/MO2/mo2_update_arsenal/bin/modhunter-cli.exe
          Copy-Item -Recurse native/resources/archive-tools native/target/portable/MO2/mo2_update_arsenal/bin/archive-tools
          Copy-Item native/target/qt-bridge/Release/modhunter-qt-bridge.dll native/target/portable/MO2/mo2_update_arsenal/bin/modhunter-qt-bridge.dll
          New-Item -ItemType Directory -Force native/target/portable/Evidence | Out-Null
          Copy-Item native/target/native-smoke/native-smoke.json native/target/portable/Evidence/
          Copy-Item native/target/watchtower-smoke/watchtower-smoke.json native/target/portable/Evidence/
          Copy-Item native/target/archive-review-proof.json native/target/portable/Evidence/
          Copy-Item native/target/qt-forward/qt-forward.json native/target/portable/Evidence/
          Copy-Item native/target/live-mo2-smoke/desktop-live.json native/target/portable/Evidence/
          $BenchmarkFiles = @(python native/scripts/prepare_release.py --benchmark-files)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($EvidenceName in $BenchmarkFiles) {
            Copy-Item -LiteralPath "native/evidence/$EvidenceName" -Destination native/target/portable/Evidence/ -ErrorAction Stop
          }
          @{ version = $ReleaseVersion; commit = '${{ github.sha }}'; workflow = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' } | ConvertTo-Json | Set-Content -Encoding utf8 native/target/portable/BUILD_INFO.json
          $packageRoot = (Resolve-Path native/target/portable).Path
          Get-ChildItem -File -Recurse $packageRoot | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object FullName | ForEach-Object { $relative = [IO.Path]::GetRelativePath($packageRoot, $_.FullName).Replace('\', '/'); "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $relative" } | Set-Content -Encoding utf8 native/target/portable/SHA256SUMS.txt
          Compress-Archive -Path native/target/portable/* -DestinationPath native/target/Modhunter-Rust-Windows.zip -Force
      - name: Preserve native executable, installer and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modhunter-Rust-Windows
          if-no-files-found: warn
          retention-days: 90
          path: |
            native/target/Modhunter-Rust-Windows.zip
            native/target/release/bundle/nsis/*.exe
            native/target/qt-bridge/Release/modhunter-qt-bridge.dll
            native/target/qt-forward/qt-forward.json
            native/target/live-mo2-smoke/*.json
            native/target/live-mo2-smoke/*.png
            native/target/native-smoke/*.json
            native/target/native-smoke/*.jsonl
            native/target/native-smoke/*.log
            native/target/native-smoke/*.png
            native/target/watchtower-smoke/*.json
            native/target/watchtower-smoke/*.jsonl
            native/target/watchtower-smoke/*.log
            native/target/archive-review-proof.json
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [contracts, windows, mo2]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Modhunter-*
          path: release-input
      - name: Verify the built packages and prepare immutable release assets
        env:
          MODHUNTER_BUILD_COMMIT: ${{ github.sha }}
          MODHUNTER_BUILD_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 native/scripts/prepare_release.py release-input release-assets --commit "$MODHUNTER_BUILD_COMMIT" --run-url "$MODHUNTER_BUILD_RUN"
      - name: Publish the tested Rust Windows release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 native/scripts/prepare_release.py --print-version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release version'; exit 1; }
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already published; existing release assets remain immutable."
            exit 0
          fi
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
            [[ "$existing" == "$GITHUB_SHA" ]] || { echo 'Existing tag does not identify this tested commit'; exit 1; }
          fi
          gh release create "$tag" release-assets/*.zip release-assets/*.exe release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Modhunter $version — Rust desktop" --notes-file release-assets/release-notes.md
  mo2:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-on-failure: 'true'
      - name: Install the Qt SDK matching MO2 2.5.2
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.1'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          archives: qtbase
          cache: 'true'
          set-env: 'false'
      - name: Build and test the narrow native Qt bridge
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.qt.outputs.qt-root-dir }}/bin;$env:PATH"
          cmake -S native/qt_bridge -B native/target/qt-bridge -A x64 "-DCMAKE_PREFIX_PATH=${{ steps.qt.outputs.qt-root-dir }}" -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build native/target/qt-bridge --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir native/target/qt-bridge -C Release --output-on-failure
      - name: Prepare the production dashboard and pinned archive tools
        run: |
          python native/scripts/prepare_release.py --print-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python native/scripts/prepare_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python native/scripts/prepare_archive_tools.py
      - name: Build the real Rust connection client
        run: cargo build --manifest-path native/Cargo.toml --release --locked -p modhunter-core
      - name: Exercise the production plugin inside real MO2 2.5.2
        shell: pwsh
        run: ./native/scripts/mo2_native_smoke.ps1 -RustCliPath "$PWD/native/target/release/modhunter-cli.exe" -QtBridgePath "$PWD/native/target/qt-bridge/Release/modhunter-qt-bridge.dll"
      - name: Preserve native MO2 receipts and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modhunter-MO2-Native-Proof
          path: native/evidence/windows-mo2-smoke/
          if-no-files-found: error
          retention-days: 90
