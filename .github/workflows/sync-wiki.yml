name: Verify and sync ModHunter Wiki
on:
  pull_request:
    paths:
      - 'wiki/**'
      - 'scripts/*sync_wiki*'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push reviewed pages to the live Wiki (unchecked = preview)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test no-loss wiki planning
        run: |
          bash -n scripts/sync_wiki.sh
          python3 -m unittest discover -s scripts -p 'test_sync_wiki.py' -v
          bash scripts/test_sync_wiki_git.sh
  wiki:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: modhunter-live-wiki
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preview or publish canonical pages
        env:
          MODHUNTER_WIKI_TOKEN: ${{ secrets.MODHUNTER_WIKI_TOKEN || github.token }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$PUBLISH" = true ]; then
            bash scripts/sync_wiki.sh --publish
          else
            bash scripts/sync_wiki.sh --preview
          fi
