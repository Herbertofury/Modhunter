name: Prepare single-bridge native acceptance
on:
  push:
    branches: [repair/single-bridge-0102]
    paths: ['.delivery/single-bridge.json', '.github/workflows/apply-single-bridge.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Herbertofury/Modhunter' && github.ref == 'refs/heads/repair/single-bridge-0102'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded source-hash checked corrections
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 9192fe2d507a885b0177cb61d0955817a40f85ac HEAD -- . ':!.delivery' ':!.github/workflows/apply-single-bridge.yml'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          entries=json.loads(Path('.delivery/single-bridge.json').read_text())
          allowed={'native/scripts/mo2_native_smoke.ps1','native/scripts/mo2_smoke_plugin/modhunter_native_smoke/runner.py','native/scripts/verify_live_desktop.cjs','native/Check_MO2_Readiness.ps1','native/Install_MO2_Plugin.ps1','native/scripts/prepare_release.py'}
          assert len(entries)==len(allowed) and {e['path'] for e in entries}==allowed
          for entry in entries:
              p=Path(entry['path']);raw=p.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==entry['before'],str(p)
              text=raw.decode('utf-8')
              for old,new in entry['replacements']:
                  assert text.count(old)==1,str(p)
                  text=text.replace(old,new)
              encoded=text.encode('utf-8')
              assert hashlib.sha256(encoded).hexdigest()==entry['after'],str(p)
              p.write_bytes(encoded)
          PY
          git rm .delivery/single-bridge.json
          node --check native/scripts/verify_live_desktop.cjs
          python3 -m py_compile native/scripts/mo2_smoke_plugin/modhunter_native_smoke/runner.py
          python3 -m unittest discover -s tests -p 'test_native_qt_bridge.py' -q
          python3 native/scripts/prepare_release.py --self-test
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Load one unchanged production bridge in the native observation fixture' -m 'Keep production package bytes outside the fixture auto-loader to avoid a duplicate startup beside the observation subclass. Preserve every native discovery/action assertion, capture bounded failure UI diagnostics, and align installation wording with automatic startup. No production connection logic or acceptance requirement is relaxed.'
          git push origin HEAD:refs/heads/repair/single-bridge-0102
