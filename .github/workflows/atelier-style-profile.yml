name: Complete-library style diagnostics

on:
  workflow_dispatch:
  push:
    branches: ['diagnostics/atelier-style']
    paths: ['tests/visual_style_profile.py', 'tests/visual_trace_probe.py', 'tests/visual_startup_trace.py', '.github/workflows/atelier-style-profile.yml']

permissions:
  contents: read

concurrency:
  group: modhunter-style-profile-${{ github.sha }}
  cancel-in-progress: true

jobs:
  scaling:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure complete fixtures at explicit diagnostic sizes
        run: |
          python3 -m venv /tmp/modhunter-style
          /tmp/modhunter-style/bin/pip install -q playwright==1.57.0
          MODHUNTER_PROFILE_BROWSER=$(/tmp/modhunter-style/bin/python -c "import shutil; print(shutil.which('chromium') or shutil.which('chromium-browser') or '')")
          if [[ -z "$MODHUNTER_PROFILE_BROWSER" ]]; then
            echo "::error::The preinstalled Chromium engine used by the prior diagnostics is unavailable."
            exit 1
          fi
          for MODHUNTER_PROFILE_COUNT in 250 1000 4000 11207; do
            PYTHONPATH=. /tmp/modhunter-style/bin/python tests/visual_style_profile.py --executable-path "$MODHUNTER_PROFILE_BROWSER" --output "native/target/style-scaling/records-$MODHUNTER_PROFILE_COUNT" --mods "$MODHUNTER_PROFILE_COUNT" --scaling-diagnostic --variants control --trace-variants '' --actions gallery,density,list
          done
      - name: Preserve every complete-fixture timing receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modhunter-Complete-Library-Scaling
          path: native/target/style-scaling/
          if-no-files-found: error
          retention-days: 30
