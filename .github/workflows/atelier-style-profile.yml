name: Complete-library style diagnostics
on:
  workflow_dispatch:
  push:
    branches: ['diagnostics/atelier-style']
    paths: ['tests/prepare_ci_fonts.py', 'tests/test_watchtower_native_ui.py', '.github/workflows/atelier-style-profile.yml']
permissions:
  contents: read
concurrency:
  group: modhunter-style-profile-${{ github.sha }}
  cancel-in-progress: true
jobs:
  cjk-rendering:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned CJK font and actual translated interface
        env:
          MODHUNTER_REQUIRE_BROWSER: '1'
        run: |
          python3 -m venv /tmp/modhunter-cjk
          /tmp/modhunter-cjk/bin/pip install -q playwright==1.57.0
          if ! command -v chromium >/dev/null && ! command -v chromium-browser >/dev/null; then
            echo '::error::The preinstalled Chromium engine is unavailable.'
            exit 1
          fi
          /tmp/modhunter-cjk/bin/python tests/prepare_ci_fonts.py --output native/target/cjk-proof/ci-fonts.json
          PYTHONPATH=. MODHUNTER_QA_OUTPUT="$PWD/native/target/cjk-proof" /tmp/modhunter-cjk/bin/python tests/test_watchtower_native_ui.py
      - name: Preserve font provenance and actual rendered locale proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modhunter-CJK-Font-Proof
          path: native/target/cjk-proof/
          if-no-files-found: error
          retention-days: 90
