name: Parity offline development kit
on:
  push:
    branches: [upgrade/whimwatch-parity-0110]
    paths: ['.github/workflows/parity-development-kit.yml']
permissions:
  contents: read
jobs:
  development-inputs:
    if: github.repository == 'Herbertofury/Modhunter'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Preserve public compiler and locked dependency sources only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parity-kit/vendor"
          cargo vendor --locked --manifest-path native/Cargo.toml "$RUNNER_TEMP/parity-kit/vendor" > "$RUNNER_TEMP/parity-kit/vendor-config.toml"
          sysroot=$(rustc --print sysroot)
          mkdir -p "$RUNNER_TEMP/parity-kit/toolchain"
          cp -a "$sysroot/bin" "$sysroot/lib" "$RUNNER_TEMP/parity-kit/toolchain/"
          find "$RUNNER_TEMP/parity-kit/toolchain" -type d -name doc -prune -exec rm -rf {} +
          rustc -Vv > "$RUNNER_TEMP/parity-kit/RUST.txt"
          sha256sum native/Cargo.lock > "$RUNNER_TEMP/parity-kit/CARGO_LOCK_SHA256.txt"
          tar -C "$RUNNER_TEMP/parity-kit" -czf "$RUNNER_TEMP/Modhunter-Offline-Development.tar.gz" .
          cd "$RUNNER_TEMP"
          sha256sum Modhunter-Offline-Development.tar.gz > DEVELOPMENT-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Modhunter-Offline-Development
          path: |
            ${{ runner.temp }}/Modhunter-Offline-Development.tar.gz
            ${{ runner.temp }}/DEVELOPMENT-SHA256.txt
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
