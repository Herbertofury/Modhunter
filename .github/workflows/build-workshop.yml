name: Verify Modhunter dashboard and standalone HTML
on:
  push:
    branches: [main]
    paths:
      - 'mo2_update_arsenal/**'
      - 'desktop/**'
      - 'tests/**'
      - 'build.py'
      - 'release_v08.py'
      - '.github/workflows/build-workshop.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: modhunter-workshop-package
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04  # Playwright 1.57 browser dependencies do not support Ubuntu 26.04
    env:
      MODHUNTER_ARTIFACT_DIR: /tmp/modhunter-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Python unit tests and independent update planning
        run: |
          python3 -m py_compile tests/updater_sss_browser_qa.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check Electron syntax
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/chrome.js
          node --check desktop/offline_mo2.cjs
          node --test desktop/offline_mo2.test.cjs
      - name: Verify full-list ticket lookup equivalence and benchmark
        run: node scripts/benchmark_workshop_tickets.cjs
      - name: Compile single-file standalone dashboard and check its JavaScript
        run: |
          python3 build.py
          python3 - <<'PY'
          import re,subprocess
          from pathlib import Path
          page=Path('mo2_update_arsenal/web/index.html').read_text('utf-8')
          scripts=[body for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',page,flags=re.S|re.I) if 'application/json' not in attrs.lower()]
          assert scripts, 'No inline JS found in built app'
          for n,script in enumerate(scripts):
              if script.strip():
                  name=Path('/tmp')/f'modhunter-check-{n}.js'
                  name.write_text(script,encoding='utf-8')
                  subprocess.run(['node','--check',str(name)],check=True)
          assert 'The Update <em>Workshop</em>' in page
          assert 'function queueWorkshop(){' in page and 'async function performQueuedWorkshop' in page
          print('Verified',len(scripts),'scripts and standalone workshop')
          PY
      - name: Exercise real Chromium update and install-briefing workflow
        timeout-minutes: 12
        env:
          MODHUNTER_REQUIRE_BROWSER: '1'
        run: |
          python3 -m venv /tmp/modhunter-browser-qa
          /tmp/modhunter-browser-qa/bin/pip install -q --disable-pip-version-check playwright==1.57.0
          /tmp/modhunter-browser-qa/bin/python -m playwright install --with-deps chromium
          PYTHONPATH=. MODHUNTER_QA_OUTPUT=/tmp/modhunter-browser-proof /tmp/modhunter-browser-qa/bin/python tests/updater_sss_browser_qa.py
      - name: Preserve Chromium interaction proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modhunter-Chromium-Review-and-Install-QA
          if-no-files-found: ignore
          retention-days: 30
          path: /tmp/modhunter-browser-proof/
      - name: Prepare the verified standalone HTML artifact
        run: |
          python3 - <<'PYBUILD'
          import hashlib,json,os,shutil
          from pathlib import Path
          output=Path(os.environ['MODHUNTER_ARTIFACT_DIR'])/'standalone'
          output.mkdir(parents=True,exist_ok=True)
          page=output/'Modhunter.html'
          shutil.copyfile('mo2_update_arsenal/web/index.html',page)
          info={
              'schemaVersion':1,
              'kind':'verified-standalone-html',
              'commit':os.environ['GITHUB_SHA'],
              'workflow':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
              'sha256':hashlib.sha256(page.read_bytes()).hexdigest(),
              'bytes':page.stat().st_size,
              'nativeMo2PluginIncluded':False,
              'rustHelperIncluded':False,
          }
          (output/'BUILD_INFO.json').write_text(json.dumps(info,indent=2)+'\n',encoding='utf-8')
          (output/'SHA256SUMS.txt').write_text(info['sha256']+'  Modhunter.html\n',encoding='utf-8')
          shutil.copyfile('wiki/Standalone-HTML.md',output/'Standalone-HTML.md')
          print(json.dumps(info))
          PYBUILD
      - name: Upload the verified standalone dashboard
        uses: actions/upload-artifact@v4
        with:
          name: Modhunter-Standalone-HTML
          retention-days: 90
          if-no-files-found: error
          path: /tmp/modhunter-artifacts/standalone/
