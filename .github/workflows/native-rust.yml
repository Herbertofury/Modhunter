name: Rust desktop and MO2 readiness
on:
  push:
    branches: [main, 'upgrade/rust-desktop-mo2']
    paths: ['native/**', 'mo2_update_arsenal/**', 'tests/**', 'build.py', '.github/workflows/native-rust.yml']
  pull_request:
    paths: ['native/**', 'mo2_update_arsenal/**', 'tests/**', 'build.py', '.github/workflows/native-rust.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: modhunter-rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Rust, MO2 lifecycle, and existing features
        run: |
          cargo fmt --manifest-path native/Cargo.toml --all -- --check
          cargo test --manifest-path native/Cargo.toml --workspace --locked
          cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets --locked -- -D warnings
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          node --check native/ui/shell.js
          node --test tests/frontend_runtime.test.cjs
          node --test desktop/offline_mo2.test.cjs
          python3 native/scripts/prepare_assets.py
      - name: Exercise actual dashboard in Chromium
        run: |
          python3 -m venv /tmp/modhunter-qa
          /tmp/modhunter-qa/bin/pip install -q playwright==1.57.0
          /tmp/modhunter-qa/bin/python -m playwright install --with-deps chromium
          PYTHONPATH=. MODHUNTER_QA_OUTPUT=/tmp/modhunter-proof /tmp/modhunter-qa/bin/python tests/updater_sss_browser_qa.py
          PYTHONPATH=. /tmp/modhunter-qa/bin/python -m unittest discover -s tests -p 'test_frontend_responsiveness.py' -v
      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modhunter-Rust-Browser-Proof
          path: /tmp/modhunter-proof/
          if-no-files-found: warn
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare all existing dashboard and game assets
        run: python native/scripts/prepare_assets.py
      - name: Test native Windows code
        run: cargo test --manifest-path native/Cargo.toml --workspace --locked
      - name: Build Rust executable and Windows installer
        working-directory: native/crates/modhunter-desktop
        run: npx --yes @tauri-apps/cli@2 build
      - name: Build portable Rust diagnostic CLI
        run: cargo build --manifest-path native/Cargo.toml --release --locked -p modhunter-core
      - name: Launch actual Windows WebView2 and import a fixture profile
        shell: pwsh
        run: ./native/scripts/windows_smoke.ps1 -Executable "$PWD/native/target/release/Modhunter.exe" -Output "$PWD/native/target/native-smoke"
      - name: Package tested Windows app, MO2 plugin, and diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native/target/portable/MO2 | Out-Null
          Copy-Item native/target/release/Modhunter.exe native/target/portable/
          Copy-Item -Recurse mo2_update_arsenal native/target/portable/MO2/
          Get-ChildItem -Recurse native/target/portable -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Copy-Item native/README.md native/target/portable/README.md
          Copy-Item native/Install_MO2_Plugin.ps1 native/target/portable/
          Copy-Item native/Install_MO2_Plugin.bat native/target/portable/
          Copy-Item native/target/release/modhunter-cli.exe native/target/portable/
          Get-FileHash native/target/portable/Modhunter.exe -Algorithm SHA256 | Format-List | Out-File native/target/portable/SHA256.txt
          Compress-Archive -Path native/target/portable/* -DestinationPath native/target/Modhunter-Rust-Windows.zip -Force
      - name: Preserve native executable, installer and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modhunter-Rust-Windows
          if-no-files-found: warn
          retention-days: 90
          path: |
            native/target/Modhunter-Rust-Windows.zip
            native/target/release/bundle/nsis/*.exe
            native/target/native-smoke/native-smoke.json
