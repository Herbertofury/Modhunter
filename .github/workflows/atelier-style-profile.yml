name: Complete-library style diagnostics

on:
  workflow_dispatch:
  push:
    branches: ['diagnostics/atelier-style']
    paths: ['tests/visual_style_profile.py', 'tests/visual_trace_probe.py', '.github/workflows/atelier-style-profile.yml']

permissions:
  contents: read

concurrency:
  group: modhunter-style-profile-${{ github.sha }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: page-attached-selectors
            variants: 'control'
            traces: 'control'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Profile all library records in actual Chromium
        env:
          PROFILE_VARIANTS: ${{ matrix.variants }}
          PROFILE_TRACES: ${{ matrix.traces }}
        run: |
          python3 -m venv /tmp/modhunter-style
          /tmp/modhunter-style/bin/pip install -q playwright==1.57.0
          /tmp/modhunter-style/bin/python -m playwright install --with-deps chromium
          MODHUNTER_PROFILE_BROWSER=$(/tmp/modhunter-style/bin/python -c "import shutil; print(shutil.which('chromium') or shutil.which('chromium-browser') or '')")
          if [[ -n "$MODHUNTER_PROFILE_BROWSER" ]]; then
            PYTHONPATH=. /tmp/modhunter-style/bin/python tests/visual_trace_probe.py --executable-path "$MODHUNTER_PROFILE_BROWSER" --output native/target/style-profile/trace-preflight
            PYTHONPATH=. /tmp/modhunter-style/bin/python tests/visual_style_profile.py --executable-path "$MODHUNTER_PROFILE_BROWSER" --output native/target/style-profile --mods 11207 --variants "$PROFILE_VARIANTS" --trace-variants "$PROFILE_TRACES" --actions gallery
          else
            PYTHONPATH=. /tmp/modhunter-style/bin/python tests/visual_trace_probe.py --output native/target/style-profile/trace-preflight
            PYTHONPATH=. /tmp/modhunter-style/bin/python tests/visual_style_profile.py --output native/target/style-profile --mods 11207 --variants "$PROFILE_VARIANTS" --trace-variants "$PROFILE_TRACES" --actions gallery
          fi
      - name: Preserve selector measurements and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modhunter-Complete-Library-Style-Profile-${{ matrix.name }}
          path: native/target/style-profile/
          if-no-files-found: error
          retention-days: 30
